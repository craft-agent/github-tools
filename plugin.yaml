name: github-tools
version: 0.6.1
description: "GitHub tools for coding agents: issues, project boards, pull requests, repositories, releases and Actions."
manifest_version: 1
requires_hermes: ">=0.22"
provides_tools:
  - github_issue_close
  - github_issue_comment
  - github_issue_create
  - github_issue_develop
  - github_issue_edit
  - github_issue_read
  - github_issue_relate
  - github_issue_reopen
  - github_pr_close
  - github_pr_comment
  - github_pr_create
  - github_pr_edit
  - github_pr_merge
  - github_pr_read
  - github_pr_ready
  - github_pr_reopen
  - github_pr_review
  - github_project_create
  - github_project_field_ensure
  - github_project_item_add
  - github_project_item_archive
  - github_project_item_convert
  - github_project_item_create
  - github_project_item_edit
  - github_project_item_unarchive
  - github_project_link
  - github_project_read
  - github_project_unlink
  - github_project_view_ensure
  - github_stack_link
  - github_stack_read
  - github_stack_unlink
provides_hooks:
  - pre_tool_call
config_schema:
  toolsets:
    description: 'The toolsets that are on: a list of issues, pull_requests, projects, repos, releases and actions, or "all". Defaults to issues, pull_requests and projects.'
  read_only:
    type: bool
    description: Registers no tool that writes. Wins over every other setting.
  tools:
    type: list
    description: Single tools to add by id, whatever their toolset.
  exclude_tools:
    type: list
    description: Single tools to remove by id. Wins over tools and toolsets.
